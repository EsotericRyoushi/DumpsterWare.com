<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found — DumpsterWare</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <style>
    :root {
      --bg: #070a0f;
      --txt: #eef2f8;
      --mut: #9aa7bb;
      --dim: #6d7b90;
      --accent: #ffb020;
      --line: rgba(255, 255, 255, 0.1);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 32px;
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: var(--txt);
      text-align: center;
      background:
        radial-gradient(900px 520px at 50% -10%, rgba(224, 49, 49, 0.22), transparent 62%),
        radial-gradient(700px 420px at 50% 110%, rgba(255, 176, 32, 0.12), transparent 60%),
        var(--bg);
    }
    .mark {
      width: 56px;
      height: 56px;
      color: var(--accent);
      margin-bottom: 28px;
      filter: drop-shadow(0 0 20px rgba(255, 176, 32, 0.4));
    }
    .code {
      font-family: "Space Grotesk", "Inter", sans-serif;
      font-size: clamp(6rem, 22vw, 12rem);
      font-weight: 700;
      line-height: 0.85;
      letter-spacing: -0.06em;
      background: linear-gradient(102deg, #ffe0a1, var(--accent) 45%, #ff6b3d);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    h1 {
      font-family: "Space Grotesk", "Inter", sans-serif;
      font-size: clamp(1.4rem, 4vw, 2rem);
      letter-spacing: -0.02em;
      margin: 28px 0 10px;
    }
    p { margin: 0; color: var(--mut); max-width: 42ch; line-height: 1.7; }
    .actions { margin-top: 32px; display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
    a {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 13px 22px;
      border-radius: 999px;
      font-size: 0.92rem;
      font-weight: 600;
      text-decoration: none;
      transition: transform 0.18s ease, border-color 0.18s ease;
    }
    a:hover { transform: translateY(-2px); }
    .primary { background: linear-gradient(180deg, #ffc94f, #ffa000); color: #1b1305; }
    .ghost { border: 1px solid var(--line); color: var(--txt); }
    .ghost:hover { border-color: rgba(255, 176, 32, 0.5); }
  </style>
</head>
<body>
  <main>
    <svg class="mark" viewBox="0 0 432 432" aria-hidden="true">
      <path d="M118 302h100a62 62 0 0 0 62-62V126" fill="none" stroke="currentColor" stroke-width="36" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="156" cy="302" r="18" fill="currentColor"/>
    </svg>
    <div class="code">404</div>
    <h1>That page went in the dumpster.</h1>
    <p>The link is broken or the page has moved. Head back to the homepage and we'll get you sorted.</p>
    <div class="actions">
      <a class="primary" href="/">Back to DumpsterWare</a>
      <a class="ghost" href="/#programs">See our programs</a>
    </div>
  </main>
</body>
</html>
