<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found — DumpsterWare</title>
  <meta name="robots" content="noindex">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0a0807">
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: dark;
      --bg: #0a0807;
      --txt: #f6eee5;
      --mut: #b7a89b;
      --accent: #ffb020;
      --line: rgba(255, 231, 208, 0.14);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 32px;
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size-adjust: from-font;
      color: var(--txt);
      text-align: center;
      overflow-wrap: break-word;
      background:
        radial-gradient(900px 520px at 50% -10%, rgba(184, 73, 47, 0.30), transparent 62%),
        radial-gradient(700px 420px at 50% 110%, rgba(255, 176, 32, 0.12), transparent 60%),
        var(--bg);
    }
    .mark {
      width: 56px;
      height: 56px;
      color: var(--accent);
      margin-bottom: 28px;
      filter: drop-shadow(0 0 20px rgba(255, 176, 32, 0.4));
    }
    .code {
      font-family: "Fraunces", Georgia, "Times New Roman", serif;
      font-size: clamp(6rem, 22vw, 12rem);
      font-weight: 600;
      line-height: 1;
      padding-block: 0.04em;
      letter-spacing: -0.04em;
      background: linear-gradient(102deg, #ffe0a1, var(--accent) 45%, #e0612f);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    h1 {
      font-family: "Fraunces", Georgia, "Times New Roman", serif;
      font-size: clamp(1.4rem, 4vw, 2rem);
      font-weight: 600;
      letter-spacing: -0.02em;
      margin: 28px 0 10px;
      text-wrap: balance;
    }
    p { margin: 0; color: var(--mut); max-width: 42ch; line-height: 1.7; text-wrap: pretty; }
    .actions { margin-top: 32px; display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
    a {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 13px 22px;
      border-radius: 999px;
      font-size: 0.92rem;
      font-weight: 600;
      text-decoration: none;
      transition: transform 0.18s ease, border-color 0.18s ease;
    }
    a:hover { transform: translateY(-2px); }
    a:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
    .primary { background: linear-gradient(180deg, #ffc94f, #ffa000); color: #1b1305; }
    .ghost { border: 1px solid var(--line); color: var(--txt); }
    .ghost:hover { border-color: rgba(255, 176, 32, 0.5); }
    @media (forced-colors: active) {
      .code { color: CanvasText; -webkit-text-fill-color: CanvasText; background: none; }
      .primary { background: Highlight; color: HighlightText; border: 1px solid Highlight; }
      .ghost { border-color: ButtonText; color: ButtonText; }
    }
    @media (prefers-reduced-motion: reduce) {
      a, a:hover { transition: none; transform: none; }
    }
  </style>
</head>
<body>
  <main>
    <svg class="mark" viewBox="0 0 432 432" aria-hidden="true">
      <path d="M118 302h100a62 62 0 0 0 62-62V126" fill="none" stroke="currentColor" stroke-width="36" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="156" cy="302" r="18" fill="currentColor"/>
    </svg>
    <div class="code">404</div>
    <h1>That page went in the dumpster.</h1>
    <p>The link is broken or the page has moved. Head back to the homepage and we'll get you sorted.</p>
    <div class="actions">
      <a class="primary" href="/">Back to DumpsterWare</a>
      <a class="ghost" href="/#programs">See our programs</a>
    </div>
  </main>
</body>
</html>
