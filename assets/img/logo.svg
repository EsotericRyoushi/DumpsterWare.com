      <rect x="152" y="182" width="76" height="26" rx="13" fill="#f4e8d4" stroke="#1d110b" stroke-width="12"/>
      <rect x="92" y="204" width="196" height="42" rx="21" fill="#f4e8d4" stroke="#1d110b" stroke-width="14"/>
