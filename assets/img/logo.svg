<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="DumpsterWare logo">
  <title>DumpsterWare</title>
  <rect width="512" height="512" rx="112" fill="#d9481b"/>

  <g transform="translate(-20 0)">
    <!-- floppy disk -->
    <g transform="rotate(-16 386 225)">
      <path d="M316 108h134l32 32v158H316z" fill="#2b3038" stroke="#1d110b" stroke-width="14" stroke-linejoin="round"/>
      <rect x="344" y="126" width="98" height="56" rx="8" fill="#cfc9bd" stroke="#1d110b" stroke-width="10"/>
      <rect x="390" y="139" width="26" height="30" rx="4" fill="#2b3038"/>
      <rect x="342" y="200" width="108" height="78" rx="6" fill="#f4e8d4" stroke="#1d110b" stroke-width="10"/>
      <path d="M360 222h64M360 242h64M360 262h46" stroke="#d9481b" stroke-width="8" stroke-linecap="round"/>
    </g>

    <!-- flame rising from the disk slot -->
    <path d="M350 156c-20-15-28-37-16-59 4 12 10 18 16 24-4-22 4-42 20-60-2 22 8 32 12 46 10-12 12-28 8-40 16 22 20 48 6 66-10 14-28 24-46 23z" fill="#ff9a4d" stroke="#1d110b" stroke-width="12" stroke-linejoin="round"/>
    <path d="M352 145c-14-11-19-27-11-43 4 9 9 14 13 18-2-16 4-30 14-42-2 16 6 24 9 34 7-8 8-18 6-26 10 14 12 32 4 44-6 10-18 16-35 15z" fill="#ffd9b3"/>

    <!-- side handles -->
    <rect x="124" y="318" width="30" height="58" rx="15" fill="#efe2cc" stroke="#1d110b" stroke-width="13"/>
    <rect x="314" y="318" width="30" height="58" rx="15" fill="#efe2cc" stroke="#1d110b" stroke-width="13"/>

    <!-- can body -->
    <path d="M146 278h176l-8 136c-1 12-9 20-21 20H175c-12 0-20-8-21-20z" fill="#efe2cc" stroke="#1d110b" stroke-width="14" stroke-linejoin="round"/>
    <path d="M188 298l5 110M226 298l2 110M264 298l-2 110M300 298l-5 110" stroke="#c9b7a0" stroke-width="8" stroke-linecap="round"/>

    <!-- rim -->
    <rect x="132" y="240" width="204" height="40" rx="14" fill="#f4e8d4" stroke="#1d110b" stroke-width="14"/>

    <!-- lid -->
