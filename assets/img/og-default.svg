<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <radialGradient id="glowTop" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#b8492f" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#b8492f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowBottom" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e85a1c" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#e85a1c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="markGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e85a1c" stop-opacity="0.45"/>
      <stop offset="70%" stop-color="#e85a1c" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#e85a1c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="headlineGrad" x1="0" y1="0" x2="1" y2="0.6">
      <stop offset="0%" stop-color="#ffb877"/>
      <stop offset="45%" stop-color="#ef6a24"/>
      <stop offset="100%" stop-color="#c9430f"/>
    </linearGradient>
    <pattern id="grid" width="72" height="72" patternUnits="userSpaceOnUse">
      <path d="M72 0H0V72" fill="none" stroke="#ffe7d0" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="#0a0807"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <circle cx="1010" cy="40" r="520" fill="url(#glowTop)"/>
  <circle cx="120" cy="700" r="480" fill="url(#glowBottom)"/>

  <circle cx="955" cy="315" r="330" fill="url(#markGlow)"/>
  <g transform="rotate(-6 955 315)">
