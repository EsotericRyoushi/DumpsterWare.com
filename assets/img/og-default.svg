  </g>

  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="72" y="196" font-size="19" font-weight="600" letter-spacing="4.5" fill="#e85a1c">INDEPENDENT STUDIO &#183; EST. 2021</text>
  </g>

  <g font-family="Georgia, 'Times New Roman', serif" font-weight="bold">
    <text x="72" y="272" font-size="58" letter-spacing="-1.6" fill="#f6eee5">Games you&#8217;ll keep.</text>
    <text x="72" y="338" font-size="58" letter-spacing="-1.6" fill="#f6eee5">Tools that hold up.</text>
    <text x="72" y="404" font-size="58" letter-spacing="-1.6" fill="url(#headlineGrad)">Apps worth installing.</text>
  </g>

  <text x="74" y="470" font-family="Segoe UI, Arial, sans-serif" font-size="23" fill="#b7a89b">We make the games we want to play and the tools we actually use.</text>

  <rect x="72" y="520" width="1056" height="1" fill="#ffe7d0" fill-opacity="0.16"/>

  <g font-family="Segoe UI, Arial, sans-serif" font-size="19" fill="#9c8d80">
    <text x="72" y="574" font-weight="600" letter-spacing="2.4" fill="#f6eee5">DUMPSTERWARE</text>
    <text x="72" y="604" font-size="16" letter-spacing="0.4">Games &#183; Apps &#183; Tools</text>
    <text x="1128" y="574" text-anchor="end" font-size="16" fill="#9c8d80">EST. 2021</text>
  </g>
