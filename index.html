<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DumpsterWare — Taking you to the company site</title>
  <meta name="robots" content="noindex">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0a0807">
  <link rel="icon" href="assets/img/logo.svg" type="image/svg+xml">
  <meta http-equiv="refresh" content="0; url=home/">
  <script>location.replace("home/");</script>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 28px;
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #f6eee5;
      text-align: center;
      background:
        radial-gradient(900px 520px at 50% -10%, rgba(184, 73, 47, 0.30), transparent 62%),
        radial-gradient(700px 420px at 50% 110%, rgba(232, 90, 28, 0.14), transparent 60%),
        #0a0807;
    }
    img {
      width: 78px;
      height: 78px;
      border-radius: 18px;
      box-shadow: 0 26px 60px -24px rgba(217, 72, 27, 0.8);
    }
    p {
      margin: 20px 0 0;
      color: #b7a89b;
      font-size: 0.92rem;
    }
    a.continue {
      display: inline-flex;
      margin-top: 24px;
      padding: 12px 22px;
      border-radius: 999px;
      background: linear-gradient(180deg, #f4792f, #d9481b);
      color: #1b0d04;
      font-size: 0.9rem;
      font-weight: 600;
      text-decoration: none;
    }
    a:focus-visible { outline: 2px solid #e85a1c; outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <a href="home/" aria-label="DumpsterWare home">
      <img src="assets/img/logo.svg" alt="DumpsterWare" width="78" height="78">
    </a>
    <p>Taking you to the company site…</p>
    <a class="continue" href="home/">Continue to DumpsterWare</a>
  </main>
</body>
</html>
